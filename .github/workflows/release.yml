name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run lint
        run: node scripts/lint.mjs

      - name: Run unit tests
        run: if [ -d "test" ]; then node test/run.mjs; else echo "Tests omitted"; fi

      - name: Build all browser targets
        run: node scripts/build.mjs

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
