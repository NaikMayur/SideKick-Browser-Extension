<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sidekick</title>
		<link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
		<link rel="stylesheet" href="panel.css" />
	</head>
	<body>
		<header class="bar">
			<div class="brand"><span class="dot"></span><h1>Sidekick</h1></div>
			<div class="bar-actions">
				<button id="copy" type="button" class="ghost">Copy output</button>
				<button id="refresh" type="button" class="accent">Run all audits</button>
			</div>
		</header>
		<main>
			<section>
				<h2>Audits</h2>
				<div class="grid" id="audits"></div>
			</section>
			<section>
				<h2>Overlays</h2>
				<div class="grid" id="overlays"></div>
			</section>
			<p id="status" class="muted" role="status">Pick a tool to run it on the inspected page.</p>
			<pre id="output"></pre>
		</main>
		<script type="module" src="panel.js"></script>
	</body>
</html>
